name: Build Custom Retro-Go
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ESP-IDF Toolchain Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf python3 python3-pip python3-venv cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0

      - name: Set up Espressif ESP-IDF v4.4
        run: |
          mkdir -p ~/esp
          cd ~/esp
          git clone -b v4.4.7 --recursive https://github.com
          cd esp-idf
          ./install.sh esp32s3
          
      - name: Compile Custom Button Mapping
        run: |
          . ~/esp/esp-idf/export.sh
          python rg_tool.py --target esp32-s3-devkit release launcher

      - name: Upload Custom Binary Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: custom-retro-go-binaries
          path: |
            build/bootloader/bootloader.bin
            build/partition-table.bin
            launcher/build/launcher.bin
