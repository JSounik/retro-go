yaml

name: Build Custom Retro-Go
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ESP-IDF Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf python3 python3-pip python3-venv cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0

      - name: Set up ESP-IDF toolchain
        run: |
          mkdir -p ~/esp
          cd ~/esp
          git clone -b v4.4.7 --recursive https://github.com
          cd esp-idf
          ./install.sh esp32s3
          
      - name: Compile Retro-Go Firmware Image
        run: |
          . ~/esp/esp-idf/export.sh
          python rg_tool.py --target esp32-s3-devkit release launcher retro-core nes-go smsplus-go gwenesis

      - name: Upload Finished Image File
        uses: actions/upload-artifact@v4
        with:
          name: custom-retro-go-firmware
          path: build/retro-go_*.img
